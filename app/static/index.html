<!doctype html><html><head><meta charset="utf-8"><title>Model Router</title><style>body{font:15px system-ui;background:#0b1220;color:#e5e7eb;margin:0}.wrap{max-width:1050px;margin:auto;padding:44px}.card{background:#111827;border:1px solid #263244;border-radius:16px;padding:24px}textarea,button{width:100%;box-sizing:border-box;padding:14px;border-radius:9px;border:1px solid #374151;background:#0b1220;color:#fff}button{margin-top:12px;background:#2563eb;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{background:#0b1220;padding:16px;border-radius:12px}.v{font-size:24px;font-weight:800;color:#60a5fa}small{color:#94a3b8}</style></head><body><div class="wrap"><h1>Cost-Optimized Model Router</h1><p><small>Complexity-aware routing with cost and latency telemetry</small></p><div class="card"><textarea id="p" rows="6" placeholder="Enter a request…"></textarea><button onclick="go()">Route & Run</button><div class="stats"><div class="stat">Tier<div class="v" id="tier">—</div></div><div class="stat">Complexity<div class="v" id="score">—</div></div><div class="stat">Cost USD<div class="v" id="cost">—</div></div><div class="stat">Latency<div class="v" id="lat">—</div></div></div><h3>Response</h3><div id="out">Ready.</div><h3>Routing reasons</h3><div id="why">—</div></div></div><script>async function go(){out.innerText='Routing…';let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p.value})});let d=await r.json();tier.innerText=d.tier||'ERR';score.innerText=d.complexity_score??'—';cost.innerText=d.cost_usd?.toFixed(5)??'—';lat.innerText=d.latency_seconds?.toFixed(2)+'s';out.innerText=d.answer||d.detail;why.innerText=(d.routing_reasons||[]).join(' · ')}</script></body></html>
